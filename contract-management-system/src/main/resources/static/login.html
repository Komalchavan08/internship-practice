<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In · Contract Management System</title>
    <link rel="stylesheet" href="/css/style.css"/>
</head>
<body>

<div class="login-shell">
    <div class="case-card">
        <div class="case-tab">File No. CMS-01</div>

        <!-- ===== LOGIN FORM ===== -->
        <div id="loginView">
            <p class="case-eyebrow">Contract Management System</p>
            <h1 class="case-title">Sign in to your account</h1>

            <div class="form-error" id="loginError"></div>

            <form id="loginForm">
                <div class="field">
                    <label for="loginEmail">Email</label>
                    <input type="email" id="loginEmail" required autocomplete="username" />
                </div>
                <div class="field">
                    <label for="loginPassword">Password</label>
                    <input type="password" id="loginPassword" required autocomplete="current-password" />
                </div>
                <button type="submit" class="btn-primary" id="loginBtn">Sign In</button>
            </form>

            <div class="toggle-row">
                New here? <button type="button" id="showRegister">Create an account</button>
            </div>
        </div>

        <!-- ===== REGISTER FORM ===== -->
        <div id="registerView" class="hidden">
            <p class="case-eyebrow">Contract Management System</p>
            <h1 class="case-title">Create your account</h1>

            <div class="form-error" id="registerError"></div>
            <div class="form-success" id="registerSuccess"></div>

            <form id="registerForm">
                <div class="field">
                    <label for="regName">Full name</label>
                    <input type="text" id="regName" required />
                </div>
                <div class="field">
                    <label for="regEmail">Email</label>
                    <input type="email" id="regEmail" required autocomplete="username" />
                </div>
                <div class="field">
                    <label for="regPassword">Password</label>
                    <input type="password" id="regPassword" required minlength="4" autocomplete="new-password" />
                </div>
                <button type="submit" class="btn-primary" id="registerBtn">Create Account</button>
            </form>

            <div class="toggle-row">
                Already have an account? <button type="button" id="showLogin">Sign in</button>
            </div>
        </div>

    </div>
</div>

<script src="/js/auth.js"></script>
<script src="/js/login.js"></script>
</body>
</html>
