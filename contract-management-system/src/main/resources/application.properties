# ==============================
# Application Info
# ==============================
spring.application.name=contract-management-system

# ==============================
# Server Configuration
# ==============================
server.port=8081

# ==============================
# PostgreSQL Database Connection
# ==============================
# Update these 3 values to match your local PostgreSQL setup
spring.datasource.url=jdbc:postgresql://localhost:5432/contract_management_db
spring.datasource.username=postgres
spring.datasource.password=6088
spring.datasource.driver-class-name=org.postgresql.Driver

# ==============================
# JPA / Hibernate Configuration
# ==============================
# 'update' auto-creates/updates tables based on your entities. Great for development.
# NEVER use 'update' or 'create' in production - use 'validate' + migration tools (Flyway/Liquibase) instead.
spring.jpa.hibernate.ddl-auto=update

# Show the actual SQL Hibernate generates in the console - very useful for learning/debugging
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Tells Hibernate which SQL "dialect" (flavor) to generate for PostgreSQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ==============================
# JWT Configuration
# ==============================
# Secret key used to sign/verify tokens - must be at least 256 bits (32+ characters) for HS256.
# In a real production app this would come from an environment variable, NOT be committed to Git.
jwt.secret=ThisIsADevOnlySecretKeyForContractManagementSystemJWT2026ChangeInProd
# Token validity: 24 hours, in milliseconds (24 * 60 * 60 * 1000)
jwt.expiration-ms=86400000

# ==============================
# Swagger / OpenAPI docs
# ==============================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ==============================
# JWT Configuration
# ==============================
# NOTE: this is a dev-only placeholder secret. In a real production app,
# this MUST come from an environment variable, never committed to Git.
jwt.secret=ContractManagementSystemSecretKeyForJWTSigningMustBeLongEnough123456
# Token validity: 24 hours, in milliseconds
jwt.expiration-ms=86400000