<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Students · StudentHub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="theme.css">
    <link rel="stylesheet" href="dashboard.css">
    <link rel="stylesheet" href="viewStudents.css">
</head>
<body>

<div class="dashboard">

    <div class="sidebar">
        <div class="logo">
            <svg class="icon" viewBox="0 0 24 24"><path d="M12 3 2 8l10 5 10-5-10-5Z"/><path d="M6 10.5V16c0 1.5 3 3 6 3s6-1.5 6-3v-5.5"/><path d="M22 8v6"/></svg>
            StudentHub
        </div>
        <p class="logo-subtitle">Student Management System</p>

        <ul>
            <li>
                <a href="dashboard.html">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/><path d="M9 20v-6h6v6"/></svg>
                    Dashboard
                </a>
            </li>
            <li>
                <a href="viewStudents.html" class="active">
                    <svg class="icon" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="8" r="2.4"/><path d="M15 14.2c2.6.4 4.5 2.6 4.5 5.3"/></svg>
                    Students
                </a>
            </li>
            <li>
                <a href="addStudent.html">
                    <svg class="icon" viewBox="0 0 24 24"><circle cx="10" cy="9" r="3.2"/><path d="M3 20c0-3.4 3.1-6 7-6s7 2.6 7 6"/><path d="M19 8v6"/><path d="M16 11h6"/></svg>
                    Add Student
                </a>
            </li>
            <li>
                <a href="profile.html">
                    <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
                    Profile
                </a>
            </li>
            <li>
                <a href="#" onclick="logout()">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M14 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4"/><path d="M10 17l5-5-5-5"/><path d="M15 12H3"/></svg>
                    Logout
                </a>
            </li>
        </ul>
    </div>

    <div class="main-content">
        <div class="header">
            <div>
                <h1>All Students</h1>
                <p>Manage all registered students.</p>
            </div>
            <div class="header-actions">
                <button class="icon-btn-bell" id="recentBell" title="Recently added students">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 5-2 6-2 6h16s-2-1-2-6"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg>
                    <span class="notif-badge" id="recentBadge"></span>
                </button>
                <div class="notif-dropdown" id="recentDropdown">
                    <div class="notif-dropdown-header">Recently Added Students</div>
                    <div id="recentList"></div>
                </div>
            </div>
        </div>

        <div class="toolbar">
            <div class="search-box">
                <svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
                <input type="text" id="searchInput" placeholder="Search students by name">
            </div>

            <div class="toolbar-right">
                <select id="statusFilter">
                    <option value="ALL">All Students</option>
                    <option value="ACTIVE">Active Students</option>
                    <option value="INACTIVE">Inactive Students</option>
                </select>

                <select id="sortBy">
                    <option value="">Sort By</option>
                    <option value="nameAsc">Name (A-Z)</option>
                    <option value="nameDesc">Name (Z-A)</option>
                </select>

                <select id="pageSize">
                    <option value="5">5 / Page</option>
                    <option value="10" selected>10 / Page</option>
                    <option value="15">15 / Page</option>
                </select>

                <button class="btn btn-primary" onclick="window.location.href='addStudent.html'">
                    <svg class="icon" viewBox="0 0 24 24" style="width:16px;height:16px;stroke:#fff"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
                    Add Student
                </button>
            </div>
        </div>

        <div class="table-wrap">
            <table>
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Department</th>
                    <th>City</th>
                    <th>Course</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody id="studentTable"></tbody>
            </table>
        </div>

        <div id="pagination" class="pagination"></div>
    </div>

</div>

<script src="auditHeader.js"></script>
<script src="recentActivity.js"></script>
<script src="viewStudents.js"></script>
</body>
</html>
